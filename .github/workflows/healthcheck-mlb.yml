name: healthcheck-mlb

# Red de seguridad: si hay partidos pendientes y web/data.json lleva mas de
# 4 horas sin actualizarse, re-dispara runner-mlb via DISPATCH_PAT. Si el
# re-despacho falla (token expirado/borrado), abre un issue para avisar.
# El schedule de GitHub va retrasado en cuentas gratis, pero el healthcheck
# no necesita puntualidad: con 1-2 ejecuciones al dia basta.

on:
  schedule:
    - cron: "20 */4 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  salud:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detectar estancamiento
        id: estado
        run: |
          HOY=$(python -c "from datetime import datetime; from zoneinfo import ZoneInfo; print(datetime.now(ZoneInfo('America/New_York')).date())")
          PENDIENTES=$(python -c "
          import json
          hoy = '$HOY'
          try:
              datos = json.load(open('data/horarios.json', encoding='utf-8'))
          except Exception:
              datos = {}
          entrada = datos.get(hoy, {})
          pendientes = [k for k, v in entrada.items() if v.get('estado') == 'pendiente']
          print(len(pendientes))")
          if [ "$PENDIENTES" = "0" ]; then
            echo "Sin partidos pendientes hoy ($HOY); no hace falta vigilancia."
            echo "reintentar=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          ULTIMO=$(curl -sS "https://api.github.com/repos/${GITHUB_REPOSITORY}/commits?path=web/data.json&per_page=1" | python -c "import sys, json; print(json.load(sys.stdin)[0]['commit']['committer']['date'])")
          ANTIGUEDAD_MIN=$(python -c "
          import datetime
          fecha = datetime.datetime.fromisoformat('$ULTIMO'.replace('Z', '+00:00'))
          ahora = datetime.datetime.now(datetime.timezone.utc)
          print(int((ahora - fecha).total_seconds() // 60))")
          echo "Partidos pendientes hoy: $PENDIENTES; web/data.json sin cambios hace $ANTIGUEDAD_MIN min."
          if [ "$ANTIGUEDAD_MIN" -ge 240 ]; then
            echo "reintentar=1" >> "$GITHUB_OUTPUT"
          else
            echo "reintentar=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Re-disparar runner-mlb
        if: steps.estado.outputs.reintentar == '1'
        run: |
          echo "data.json estancado -> re-despacho runner-mlb."
          curl -sS -X POST \
            -H "Authorization: Bearer ${{ secrets.DISPATCH_PAT }}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -d '{"ref":"main"}' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/runner-mlb.yml/dispatches"

      - name: Abrir issue si el re-despacho fallo (PAT expirado?)
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --title "HEALTHCHECK: data.json estancado y re-despacho fallo" \
            --body "Hay partidos pendientes y web/data.json no se actualizo en mas de 4h.
            El re-despacho via DISPATCH_PAT fallo (HTTP != 2xx).
            Acciones:
            1. Revisar si el PAT 'cron-runner' expiro o se borro (cron-job.org y secret DISPATCH_PAT usan el mismo).
            2. Crear PAT nuevo y actualizar el secret DISPATCH_PAT + cron-job.org." || true
