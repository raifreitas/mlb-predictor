name: runner-mlb
# cadencia 5 min: mas ticks, menos perdidas por huecos del cron

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      horizonte:
        description: "Horizonte de evaluacion en minutos (pruebas: 2000 evalua todo)"
        required: false
        default: "240"
      resguardo:
        description: "Forzar respaldo matinal (1 = ejecuta la carga aunque no falte)"
        required: false
        default: "0"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: runner-mlb
  cancel-in-progress: false

jobs:
  runner:
    runs-on: ubuntu-latest
    env:
      MLB_SQLITE: "1"
      THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Fechas goal
        run: |
          echo "AYER=$(date -u -d '1 day ago' +%F)" >> "$GITHUB_ENV"
          echo "HOY=$(date -u +%F)" >> "$GITHUB_ENV"

      - name: Respaldo matinal (si el cron 06:30 no disparo)
        run: |
          HORA_UTC=$(date -u +%H%M)
          FORZAR="${{ inputs.resguardo || '0' }}"
          if [ "$FORZAR" != "1" ] && [ "$HORA_UTC" -lt "0645" ]; then
            echo "Antes de las 06:45 UTC; el ETL matinal aun tiene ventana. Se omite el respaldo."
            exit 0
          fi
          FALTA=$(python PruebaPronosticos/src/EtlPython/respaldo_matinal.py "$AYER")
          if [ "$FALTA" = "0" ]; then
            echo "Resultados de $AYER ya cargados; el ETL matinal si corrio."
            exit 0
          fi
          echo "ETL matinal no ejecutado -> el runner asume la carga de resultados (StatsAPI gratis), snapshot y reentrenamiento."
          cd PruebaPronosticos/src/EtlPython && \
            python etl_main.py "$AYER" "$AYER" && \
            python etl_main.py "$HOY" "$HOY" && \
            python etl_main.py --solo-odds "$HOY" "$HOY" && \
            cd ../Modeling && \
            python verificar_predicciones.py && \
            python entrenar_modelo.py && \
            cd ../../..

      - name: Planificador (runner por partido)
        working-directory: PruebaPronosticos/src/Modeling
        run: python planificador.py --procesar --ventana-min 30 --horizonte-max-min ${{ inputs.horizonte || '240' }}

      - name: Generar web/data.json
        working-directory: PruebaPronosticos/src/Modeling
        run: python generar_web.py

      - name: Commit si hubo cambios
        run: |
          git add data/mlb.db data/horarios.json web/data.json PruebaPronosticos/models
          if git diff --cached --quiet; then
            echo "changed=0" >> "$GITHUB_ENV"
          else
            git -c user.name="github-actions[bot]" \
               -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
               commit -m "Actualizacion automatica (runner MLB)"
            for intento in 1 2 3 4 5; do
              git pull --rebase && git push && break
              sleep 10
            done
            echo "changed=1" >> "$GITHUB_ENV"
          fi

      - name: Publicar GitHub Pages
        if: env.changed == '1'
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - name: Deploy Pages
        if: env.changed == '1'
        uses: actions/deploy-pages@v4