name: pages-manual

on:
  workflow_dispatch:

permissions:
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Publicar GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - name: Deploy Pages
        uses: actions/deploy-pages@v4