<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pronosticos MLB</title>
<style>
  :root {
    --fondo: #0b0f1a;
    --panel: #151c2e;
    --panel-2: #1b2440;
    --borde: #242f4d;
    --texto: #e2e8f5;
    --tenue: #8a95b0;
    --verde: #3ddc84;
    --rojo: #ff5d5d;
    --ambar: #ffc532;
    --azul: #4da3ff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { color-scheme: dark; }
  body {
    background:
      radial-gradient(1200px 500px at 80% -10%, rgba(77, 163, 255, .12), transparent 60%),
      radial-gradient(900px 400px at 10% -5%, rgba(61, 220, 132, .08), transparent 55%),
      var(--fondo);
    color: var(--texto);
    font-family: system-ui, "Segoe UI", Arial, sans-serif;
    line-height: 1.45;
    padding: 20px;
    min-height: 100vh;
  }
  .contenedor { max-width: 1100px; margin: 0 auto; }
  h1 {
    font-size: clamp(1.3rem, 4vw, 1.7rem);
    font-weight: 800; letter-spacing: .02em; margin-bottom: 4px;
  }
  h1 span { color: var(--azul); }
  .actualizado {
    color: var(--tenue); font-size: .82rem; margin-bottom: 18px;
  }

  .resumen {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
    gap: 10px; margin-bottom: 24px;
  }
  .card {
    background: var(--panel); border: 1px solid var(--borde);
    border-radius: 12px; padding: 12px 16px; text-align: center;
  }
  .card .num { font-size: clamp(1.3rem, 5vw, 1.7rem); font-weight: 800; }
  .card .etiqueta {
    color: var(--tenue); font-size: .72rem; text-transform: uppercase;
    letter-spacing: .06em; margin-top: 2px;
  }
  .ganada { color: var(--verde); }
  .perdida { color: var(--rojo); }
  .push { color: var(--ambar); }

  h2 {
    font-size: 1.05rem; margin: 26px 0 10px; font-weight: 700;
    display: flex; align-items: center; gap: 8px;
  }
  h2::before {
    content: ""; width: 4px; height: 18px; border-radius: 2px;
    background: var(--azul); display: inline-block;
  }

  .envuelve-tabla {
    background: var(--panel); border: 1px solid var(--borde);
    border-radius: 12px; overflow: auto; -webkit-overflow-scrolling: touch;
  }
  .tabla { width: 100%; border-collapse: collapse; min-width: 640px; }
  .tabla th {
    background: var(--panel-2); text-align: left; color: var(--tenue);
    font-size: .72rem; text-transform: uppercase; letter-spacing: .06em;
    padding: 10px 14px; border-bottom: 1px solid var(--borde);
    position: sticky; top: 0; z-index: 1;
  }
  .tabla td {
    padding: 11px 14px; border-bottom: 1px solid var(--borde);
    font-size: .9rem; white-space: nowrap;
  }
  .tabla tr:last-child td { border-bottom: none; }
  .tabla tbody tr:hover { background: rgba(77, 163, 255, .05); }
  .tabla td .debil { color: var(--tenue); }

  .estado {
    display: inline-block; padding: 3px 11px; border-radius: 999px;
    font-size: .75rem; font-weight: 700; background: var(--panel-2);
    border: 1px solid var(--borde);
  }
  .estado.futuro { color: var(--tenue); }

  footer {
    margin-top: 28px; text-align: center; color: var(--tenue);
    font-size: .74rem;
  }

  @media (max-width: 700px) {
    body { padding: 14px; }
    .resumen { grid-template-columns: repeat(2, 1fr); gap: 8px; }
    .tabla { min-width: 0; }
    .envuelve-tabla { overflow-x: auto; }
    .tabla th, .tabla td { padding: 9px 10px; font-size: .84rem; }
    .tabla th { position: static; }
  }
</style>
</head>
<body>
<div class="contenedor">
  <h1>Pronosticos <span>MLB</span></h1>
  <div class="actualizado" id="actualizado">Cargando...</div>

  <div class="resumen">
    <div class="card"><div class="num" id="num-hoy">-</div>
      <div class="etiqueta">Picks hoy</div></div>
    <div class="card"><div class="num ganada" id="num-ganadas">-</div>
      <div class="etiqueta">Ganadas</div></div>
    <div class="card"><div class="num perdida" id="num-perdidas">-</div>
      <div class="etiqueta">Perdidas</div></div>
    <div class="card"><div class="num" id="num-unidades">-</div>
      <div class="etiqueta">Unidades</div></div>
    <div class="card"><div class="num" id="num-acierto">-</div>
      <div class="etiqueta">Acierto</div></div>
  </div>

  <h2>Predicciones (historial)</h2>
  <div class="envuelve-tabla">
    <table class="tabla">
      <thead>
        <tr>
          <th>Fecha</th><th>Partido</th><th>Apuesta</th><th>Linea</th>
          <th>Unidades</th><th>Edge</th><th>Cuota</th><th>Resultado</th>
        </tr>
      </thead>
      <tbody id="tabla-predicciones"></tbody>
    </table>
  </div>

  <h2>Partidos recientes</h2>
  <div class="envuelve-tabla">
    <table class="tabla">
      <thead>
        <tr>
          <th>Fecha</th><th>Local</th><th>Visita</th><th>Marcador</th>
          <th>Linea real</th><th>Estado</th>
        </tr>
      </thead>
      <tbody id="tabla-partidos"></tbody>
    </table>
  </div>

  <footer>Generado automaticamente por GitHub Actions</footer>
</div>

<script>
  const ESC = (literal) => ["<", ">", "&", '"', "'"].reduce(
    (s, c) => s.replaceAll(c, "&" + { "<": "lt", ">": "gt", "&": "amp",
      '"': "quot", "'": "#39" }[c] + ";"), literal);

  function fila(estado) {
    if (estado === "GANADA") return "ganada";
    if (estado === "PERDIDA") return "perdida";
    if (estado === "PUSH") return "push";
    return "futuro";
  }

  function resumen(estado) {
    return { GANADA: "Ganada", PERDIDA: "Perdida", PUSH: "Push",
      PENDIENTE: "En juego", FALLIDA: "Sin linea" }[estado] || estado;
  }

  function cargarDatos(intento) {
    fetch("data.json?v=" + Date.now(), { cache: "no-store" })
      .then((r) => {
        if (!r.ok) throw new Error("HTTP " + r.status);
        return r.json();
      })
      .then((d) => {
        document.getElementById("actualizado").textContent =
          "Actualizado: " + d.fecha_actualizacion.replace("T", " ").replace("Z", " UTC");

      const preds = d.predicciones;
      const pendientes = preds.filter((p) => p.estado === "PENDIENTE").length;
      const ganadas = d.resumen.ganadas, perdidas = d.resumen.perdidas;
      document.getElementById("num-hoy").textContent = String(pendientes);
      document.getElementById("num-ganadas").textContent = String(ganadas);
      document.getElementById("num-perdidas").textContent = String(perdidas);
      const total = ganadas + perdidas + d.resumen.push;
      document.getElementById("num-unidades").textContent =
        (d.resumen.unidades > 0 ? "+" : "") + d.resumen.unidades;
      document.getElementById("num-acierto").textContent =
        total > 0 ? Math.round((ganadas / total) * 100) + "%" : "-";

      const tbodyP = document.getElementById("tabla-predicciones");
      if (preds.length === 0) {
        tbodyP.innerHTML = '<tr><td colspan="8" class="debil">Aun no hay predicciones.</td></tr>';
      } else {
        tbodyP.innerHTML = preds.slice().reverse().map((p) =>
          "<tr>" +
          "<td class='debil'>" + ESC(p.fecha) + "</td>" +
          "<td><span class='debil'>" + ESC(p.visita) + " @</span> " + ESC(p.local) + "</td>" +
          "<td>" + ESC(p.tipo) + "</td>" +
          "<td>" + ESC(String(p.linea)) + "</td>" +
          "<td>" + ESC(String(p.unidades)) + "</td>" +
          "<td class='debil'>" + ESC(String(p.edge)) + "%</td>" +
          "<td class='debil'>" + ESC(String(p.cuota)) + "</td>" +
          '<td><span class="estado ' + fila(p.estado) + '">' +
            ESC(resumen(p.estado)) + "</span></td>" +
          "</tr>").join("");
      }

      const tbodyG = document.getElementById("tabla-partidos");
      const partidos = d.partidos_hoy.slice().reverse();
      tbodyG.innerHTML = partidos.map((g) =>
        "<tr>" +
        "<td class='debil'>" + ESC(g.fecha) + "</td>" +
        "<td>" + ESC(g.local) + "</td>" +
        "<td class='debil'>" + ESC(g.visita) + "</td>" +
        "<td>" + (g.es_final
          ? '<b>' + ESC(g.carreras_local) + "</b>-" + ESC(g.carreras_visita)
          : "-") + "</td>" +
        "<td>" + (g.linea_real !== null && g.linea_real !== undefined
          ? ESC(String(g.linea_real)) : "-") + "</td>" +
        '<td><span class="estado futuro">' +
          (g.es_final ? "Final" : "Programado") + "</span></td>" +
        "</tr>").join("");
    })
    .catch(() => {
      if ((intento || 1) < 5) {
        setTimeout(() => cargarDatos((intento || 1) + 1), 3000);
      } else {
        document.getElementById("actualizado").textContent =
          "Error: no se pudo cargar data.json.";
      }
    });
  }

  cargarDatos(1);
</script>
</body>
</html>
